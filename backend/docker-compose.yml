version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proptech-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: proptech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: proptech-api
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/proptech_db?schema=public"
      JWT_SECRET: "proptech-secret-key-2026"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
